name: Build Test Deploy

# Thin caller for the shared LCMS Maven library pipeline (HOMELAB-26 E2):
#   LegoHunter/lego-server-configuration/.github/workflows/maven-library-pipeline.yml
# What runs on each event is documented there and in new-service-repo/README.md ("Library standard").

on:
  push:
    branches:
      - 'feature/**'
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    uses: LegoHunter/lego-server-configuration/.github/workflows/maven-library-pipeline.yml@develop
    with:
      # Exception to the Java 21 standard (HOMELAB-68): the pom compiles for Java 17 (java.version), but its
      # bricklink-ajax/-html/-rest 1.3.0-SNAPSHOT dependencies are Java 22 class files, which a JDK 17 javac
      # cannot read. JDK 22 reads them and still compiles --release 17. Revisit with HOMELAB-27.
      java-version: '22'
